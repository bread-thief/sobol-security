<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Sobol Security</title>
  <link rel="shortcut icon" href="TemplateData/my-favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-loading-spinner"></div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Sobol Security</div>
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') {
        div.style = 'background: red; padding: 10px;';
      }
      else {
        if (type == 'warning') {
          div.style = 'background: yellow; padding: 10px;';
        }
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Builds.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Builds.data.unityweb",
      frameworkUrl: buildUrl + "/Builds.framework.js.unityweb",
      codeUrl: buildUrl + "/Builds.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GameDevСтанция",
      productName: "Sobol Security",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = "https://bread-thief.github.io/sobol-security/";
    }

    var isMobile = isIOS || /Android/i.test(navigator.userAgent);

    if (isMobile) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "540px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";

        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var unityFooter = document.querySelector("#unity-footer");
        var container = document.querySelector("#unity-container");

        fullscreenButton.onclick = () => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function (error) {
              console.log("Блокировка ориентации не удалась: ", error);
            });
          }

          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (container.requestFullscreen) {
              container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
              container.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          }
        };

        function onFullscreenChange() {
          var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFullscreen) {
            unityFooter.classList.add("fullscreen-active");
          } else {
            unityFooter.classList.remove("fullscreen-active");
          }
        }

        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>

</html>
